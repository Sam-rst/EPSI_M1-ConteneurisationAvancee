# =============================================================================
# Stack locale de validation de l'image gestion-produits (MySQL).
# =============================================================================
# Ce compose sert UNIQUEMENT à valider l'image PHP+Apache sur la machine de
# développement. La stack de production (Traefik + version dev PostgreSQL)
# est définie séparément sous docker/compose.yml et déployée sur l'EC2 AWS.
#
# Usage :
#   cd app/
#   docker compose up --build
#   → http://localhost:8080  (login : admin / password)
#
# Volumes :
#   - mysql-data : persistance MySQL entre redémarrages
#   - uploads    : persistance des photos produit
#
# Le dump SQL fourni par Avalone est monté en lecture seule dans
# /docker-entrypoint-initdb.d et exécuté automatiquement au premier
# démarrage du conteneur MySQL.
# =============================================================================

services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: samrst/gestion-produits:local
    container_name: gestion-produits-app
    environment:
      DB_DRIVER: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: gestion_produits
      DB_USER: root
      DB_PASSWORD: root
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - uploads:/var/www/html/uploads
    restart: unless-stopped

  db:
    image: mysql:8.4
    container_name: gestion-produits-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gestion_produits
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/gestion_produits.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  mysql-data:
  uploads:
