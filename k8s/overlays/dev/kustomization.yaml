apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: gestion-produits-dev

resources:
  - namespace.yaml
  - ../../base
  - ingress.yaml

patches:
  - path: app-dev.yaml
    target:
      kind: Deployment
      name: app
  - path: db-postgres.yaml
    target:
      kind: StatefulSet
      name: db
  - path: db-service.yaml
    target:
      kind: Service
      name: db

# Secrets et ConfigMaps generes au moment du deploiement par deploy-dev.sh.
commonLabels:
  environment: dev
