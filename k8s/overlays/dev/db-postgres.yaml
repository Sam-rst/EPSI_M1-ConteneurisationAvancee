# Strategic merge patch : remplace le StatefulSet MySQL par PostgreSQL.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
spec:
  template:
    spec:
      containers:
        - name: db
          image: postgres:16
          ports:
            - name: pg
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: gestion_produits
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
            - name: MYSQL_DATABASE
              $patch: delete
            - name: MYSQL_ROOT_PASSWORD
              $patch: delete
            - name: MYSQL_USER
              $patch: delete
            - name: MYSQL_PASSWORD
              $patch: delete
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "app", "-d", "gestion_produits"]
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "app", "-d", "gestion_produits"]
            initialDelaySeconds: 60
            periodSeconds: 30
