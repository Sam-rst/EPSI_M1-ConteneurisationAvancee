apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: gestion-produits-prod

resources:
  - namespace.yaml
  - ../../base
  - ingress.yaml

# Secrets et ConfigMaps generes au moment du deploiement (cf. deploy.sh)
# - db-credentials : Secret avec user/password/root_password
# - db-init       : ConfigMap avec le dump SQL
# - app-tls       : Secret TLS avec certif auto-signe

commonLabels:
  environment: prod
